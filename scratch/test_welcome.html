<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bon Retour | LE GOUT DU MATIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: #0c1424;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .welcome-card {
            width: 100%;
            max-width: 440px;
            background: #111c30;
            border: 1px solid #1e2e47;
            border-radius: 24px;
            padding: 38px 30px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }
        /* Logo épuré dans carte arrondie */
        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            background: #17243a;
            border: 1.5px solid #23354e;
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        /* En-tête sobre et chaleureux */
        .welcome-greeting {
            font-size: 13px;
            font-weight: 700;
            color: #e58b00;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .restaurant-name {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.01em;
            margin-bottom: 22px;
        }
        /* Boîte message humaine et conviviale */
        .user-greeting-box {
            background: #17243a;
            border: 1px solid #23354e;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 24px;
            text-align: center;
        }
        .user-greeting-title {
            font-size: 16px;
            font-weight: 700;
            color: #e58b00;
            margin-bottom: 6px;
        }
        .user-greeting-text {
            font-size: 13.5px;
            font-weight: 400;
            color: #94a3b8;
            line-height: 1.5;
        }
        /* Barre de progression discrète */
        .progress-track {
            width: 100%;
            height: 4px;
            background: #1b293e;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-fill {
            height: 100%;
            width: 65%;
            background: #e58b00;
            border-radius: 10px;
        }
        .redirect-status {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 22px;
        }
        /* Bouton propre et élégant */
        .btn-direct {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 24px;
            background: #e58b00;
            color: #0c1424;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(229, 139, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="welcome-card" id="card">
        <div class="logo-box">
            <img src="https://cdn-icons-png.flaticon.com/512/857/857681.png" alt="Logo" class="logo-img">
        </div>

        <div class="welcome-greeting">Bon retour chez</div>
        <h1 class="restaurant-name">LE GOUT DU MATIN</h1>

        <div class="user-greeting-box">
            <div class="user-greeting-title">Bonjour OUEDRAOGO Jean-baptist</div>
            <div class="user-greeting-text">Excellente journée et bon service à vous ! Votre caisse est prête pour vos ventes.</div>
        </div>

        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
        <div class="redirect-status">
            Accès direct à votre espace de vente...
        </div>

        <a href="#" class="btn-direct">
            Accéder à la caisse &rarr;
        </a>
    </div>
</body>
</html>
