<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Modèle Sombre Bleu Marine & Jaune Or</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0c1424;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .login-card-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1. Carte Logo au Sommet */
        .brand-logo-card {
            width: 110px;
            height: 110px;
            background: #17243a;
            border: 1.5px solid #23354e;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.6rem;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            padding: 12px;
        }
        .brand-logo-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        /* 2. Titre & Sous-titre */
        .auth-title {
            color: #e58b00;
            font-size: 1.85rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
        }
        .auth-subtitle {
            color: #94a3b8;
            font-size: 0.88rem;
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        /* 3. Formulaire */
        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Pill Input Group */
        .pill-input-group {
            width: 100%;
            background: #1b293e;
            border: 1.5px solid #273852;
            border-radius: 50px;
            padding: 0.85rem 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            margin-bottom: 1.15rem;
            transition: all 0.25s ease;
        }
        .pill-input-group:focus-within {
            border-color: #e58b00;
            box-shadow: 0 0 18px rgba(229, 139, 0, 0.35);
            background: #203149;
        }
        .pill-input-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e58b00;
            font-size: 1.15rem;
            flex-shrink: 0;
        }
        .pill-flag-text {
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .pill-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.98rem;
            font-weight: 500;
        }
        .pill-input::placeholder {
            color: #64748b;
            font-weight: 400;
        }
        .eye-toggle-btn {
            background: none;
            border: none;
            color: #64748b;
            font-size: 1.05rem;
            cursor: pointer;
            padding: 0 0.2rem;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .eye-toggle-btn:hover {
            color: #e58b00;
        }

        /* 4. Bouton Se Connecter */
        .btn-submit-gold {
            width: 100%;
            background: #e58b00;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            border-radius: 50px;
            color: #0c1424;
            font-size: 1.08rem;
            font-weight: 800;
            padding: 0.95rem;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(229, 139, 0, 0.4);
            transition: all 0.25s ease;
            text-align: center;
            margin-top: 0.6rem;
            margin-bottom: 1.25rem;
        }
        .btn-submit-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(229, 139, 0, 0.6);
            background: linear-gradient(135deg, #fbbf24 0%, #e58b00 100%);
        }
        .btn-submit-gold:active {
            transform: translateY(1px);
        }

        /* 5. Se Souvenir de Moi */
        .remember-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            color: #94a3b8;
            font-size: 0.88rem;
            cursor: pointer;
            user-select: none;
            margin-bottom: 1.75rem;
        }
        .remember-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            border: 1.5px solid #475569;
            background: #1b293e;
            accent-color: #e58b00;
            cursor: pointer;
        }

        /* 6. Liens Inférieurs */
        .auth-footer-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
            text-align: center;
            width: 100%;
        }
        .footer-gold-link {
            color: #e58b00;
            font-size: 0.84rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .footer-gold-link:hover {
            color: #fbbf24;
            text-decoration: underline;
        }
        .footer-signup-text {
            color: #94a3b8;
            font-size: 0.86rem;
        }
        .footer-signup-text a {
            color: #e58b00;
            font-weight: 700;
            text-decoration: underline;
            margin-left: 0.25rem;
        }
        .footer-signup-text a:hover {
            color: #fbbf24;
        }

        /* Rôles rapides Admin / Gérant */
        .role-chips-wrap {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }
        .role-chip {
            background: #17243a;
            border: 1px solid #2a3d58;
            border-radius: 50px;
            padding: 0.35rem 0.95rem;
            color: #e58b00;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .role-chip:hover {
            background: #203149;
            border-color: #e58b00;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-card-container">
        <!-- 1. Logo du Restaurant dans la carte arrondie foncée -->
        <div class="brand-logo-card">
            <img src="/web/binary/company_logo" alt="Logo" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/857/857681.png';">
        </div>

        <!-- 2. Bon retour ! -->
        <h1 class="auth-title">Bon retour !</h1>
        <p class="auth-subtitle">Heureux de vous retrouver, veuillez vous connecter.</p>

        <!-- 3. Formulaire de connexion -->
        <form class="auth-form" onsubmit="event.preventDefault();">
            <!-- Champ Identifiant / Téléphone -->
            <div class="pill-input-group">
                <span class="pill-flag-text">
                    <i class="fa fa-user" style="color: #e58b00;"></i>
                </span>
                <input type="text" class="pill-input" id="loginInput" placeholder="Identifiant ou Téléphone" value="admin" required autocomplete="username">
            </div>

            <!-- Champ Mot de passe avec Cadenas Or et Oeil -->
            <div class="pill-input-group">
                <span class="pill-input-icon">
                    <i class="fa fa-lock"></i>
                </span>
                <input type="password" class="pill-input" id="passwordInput" placeholder="Mot de passe" value="admin123" required autocomplete="current-password">
                <button type="button" class="eye-toggle-btn" onclick="togglePass()">
                    <i id="eyeIcon" class="fa fa-eye"></i>
                </button>
            </div>

            <!-- Bouton Se connecter en Or Ambré -->
            <button type="submit" class="btn-submit-gold">
                Se connecter
            </button>

            <!-- Se souvenir de moi -->
            <label class="remember-wrap">
                <input type="checkbox" class="remember-checkbox" checked>
                <span>Se souvenir de moi</span>
            </label>

            <!-- Liens Inférieurs -->
            <div class="auth-footer-links">
                <a href="#" class="footer-gold-link">Mot de passe oublié ?</a>
                
                <div class="footer-signup-text">
                    Vous n'avez pas de compte? <a href="#">S'inscrire</a>
                </div>

                <a href="#" class="footer-gold-link" style="text-decoration: underline;">Conditions générales</a>
            </div>

            <!-- Raccourcis de connexion rapide -->
            <div class="role-chips-wrap">
                <button type="button" class="role-chip" onclick="fillAdmin()">👑 Admin</button>
                <button type="button" class="role-chip" onclick="fillGerant()">🧑‍💼 Gérant</button>
            </div>
        </form>
    </div>

    <script>
        function togglePass() {
            const p = document.getElementById('passwordInput');
            const eye = document.getElementById('eyeIcon');
            if (p.type === 'password') {
                p.type = 'text';
                eye.className = 'fa fa-eye-slash';
            } else {
                p.type = 'password';
                eye.className = 'fa fa-eye';
            }
        }
        function fillAdmin() {
            document.getElementById('loginInput').value = 'admin';
            document.getElementById('passwordInput').value = 'admin123';
        }
        function fillGerant() {
            document.getElementById('loginInput').value = 'gerant';
            document.getElementById('passwordInput').value = 'gerant123';
        }
    </script>
</body>
</html>
